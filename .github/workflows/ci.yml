name: CI

on:
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    name: "test (ruby: ${{ matrix.ruby-version}}, rspec: ${{ matrix.rspec-version }})"
    strategy:
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]
        rspec-version: ["3_13"]

    runs-on: ubuntu-22.04

    env:
      BUNDLE_GEMFILE: gemfiles/rspec_${{ matrix.rspec-version }}.gemfile

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ inputs.ref || github.sha }}
        persist-credentials: false

    - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rake

    - name: Upload test artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: always()
      with:
        name: ruby-${{ matrix.ruby-version }}-rspec-${{ matrix.rspec-version }}
        path: tmp

  post-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-artifacts
          pattern: ruby-*-rspec-*
          separate-directories: true
          delete-merged: true
