name: CI

on:
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: "test (ruby: ${{ matrix.ruby-version}}, rspec: ${{ matrix.rspec-version }})"
    strategy:
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]
        rspec-version: ["3_13"]

    runs-on: ubuntu-22.04

    env:
      BUNDLE_GEMFILE: gemfiles/rspec_${{ matrix.rspec-version }}.gemfile

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: ruby/setup-ruby@v1.336.0
      with:
        ruby-version: ${{ matrix.ruby-version }}
        bundler-cache: true

    - name: Run tests
      run: bundle exec rake

    - name: Upload test artifacts
      uses: actions/upload-artifact@v7.0.2
      if: always()
      with:
        name: ruby-${{ matrix.ruby-version }}-rspec-${{ matrix.rspec-version }}
        path: tmp

  post-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7.0.2
        with:
          name: test-artifacts
          pattern: ruby-*-rspec-*
          separate-directories: true
          delete-merged: true
