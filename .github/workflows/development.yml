name: Development

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: "development (ruby: ${{ matrix.ruby-version }})"
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ruby/setup-ruby@v1.336.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Test the locked development bundle
        run: bundle exec rake spec
