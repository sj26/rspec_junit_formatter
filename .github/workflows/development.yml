name: Development

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: "development (ruby: ${{ matrix.ruby-version }})"
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # Ruby 4.0 initially covers only current RSpec in the root bundle.
        ruby-version: ["3.4", "4.0"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Test the locked development bundle
        run: bundle exec rake spec
