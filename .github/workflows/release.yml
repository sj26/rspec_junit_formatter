name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z), already merged into main
        required: true
        type: string

permissions: {}

concurrency: release

jobs:
  publish:
    if: github.repository == 'sj26/rspec_junit_formatter' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ruby/setup-ruby@v1.343.0
        with:
          ruby-version: '3.4'
          bundler: none

      - name: Build the tagged gem without the development bundle
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" "$GITHUB_SHA"
          git checkout --detach "$commit"
          version=$(ruby -e 'puts Gem::Specification.load("rspec_junit_formatter.gemspec").version')
          test "$TAG" = "v$version"
          gem build rspec_junit_formatter.gemspec

      - uses: rubygems/configure-rubygems-credentials@v2.1.0
        with:
          trusted-publisher: true

      - name: Publish the gem and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="rspec_junit_formatter-${TAG#v}.gem"
          gem push --host https://rubygems.org "$file"
          gh release create "$TAG" "$file" --verify-tag --generate-notes
